[workspace]

[package]
name = "leash-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
k256 = { version = "0.13", features = ["ecdsa-core", "ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
elliptic-curve = { version = "0.13", features = ["sec1"] }
signature = "2"
num_cpus = "1"

[[bin]]
name = "leash-bench"
path = "src/main.rs"

[[bin]]
name = "exp3-performance"
path = "src/exp3_performance.rs"

[[bin]]
name = "exp6-scalability"
path = "src/exp6_scalability.rs"

[profile.release]
opt-level = 3
lto = true
