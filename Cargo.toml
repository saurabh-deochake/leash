[package]
name = "leash"
version = "0.1.0"
edition = "2021"

description = "Liveness-Enforced Authorization for Swarm Hierarchies"
license = "MIT"

[lib]
name = "leash"
path = "src/lib.rs"

[[bin]]
name = "leash-demo"
path = "src/main.rs"

[dependencies]
# Cryptographic primitives
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

# HD key derivation (BIP-32 compatible)
bip32 = "0.5"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for network simulation)
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Random number generation
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

